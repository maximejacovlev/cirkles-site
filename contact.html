<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Cirkles.ai</title>
  <meta name="description" content="Contactez l'équipe Cirkles.ai — nous répondons sous 24 h ouvrées." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter+Tight:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-heading: 'Fraunces', serif;
      --font-body: 'Inter Tight', sans-serif;
    }

    html,
    body {
      background: #fff;
      color: #000;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 20px 48px;
      position: relative;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(55% 40% at 20% 10%, rgba(0, 0, 0, 0.03) 0%, transparent 60%),
        radial-gradient(50% 40% at 80% 90%, rgba(0, 0, 0, 0.025) 0%, transparent 60%);
      pointer-events: none;
    }

    .navbar {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
    }

    .nav-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.55);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-back:hover {
      color: #000;
    }

    .card {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      padding: 36px 32px 40px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.035);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    @media (max-width: 520px) {
      .card {
        padding: 28px 22px 32px;
      }
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(26px, 4vw, 32px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .lede {
      font-size: 14px;
      line-height: 1.55;
      color: rgba(0, 0, 0, 0.5);
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
    }

    label .opt {
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      color: rgba(0, 0, 0, 0.28);
      font-size: 11px;
    }

    .field {
      margin-bottom: 18px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      font-family: var(--font-body);
      font-size: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(0, 0, 0, 0.28);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 13px 20px;
      border: none;
      border-radius: 999px;
      background: #000;
      color: #fff;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.85);
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }

    .msg.show {
      display: block;
    }

    .msg.err {
      background: rgba(220, 40, 40, 0.08);
      color: #991b1b;
    }

    .msg.ok {
      background: rgba(22, 101, 52, 0.08);
      color: #14532d;
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.35);
    }

    .footer-note a {
      color: rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-back">
      <span aria-hidden="true">←</span> Retour à l’accueil
    </a>
    <a href="demo-booking.html" class="nav-back">Demandez une Démo →</a>
  </nav>

  <main class="page">
    <div class="card">
      <h1>Nous écrire</h1>
      <p class="lede">
        Une question ou un projet&nbsp;? Envoyez votre message&nbsp;: notre équipe vous répond sous 24&nbsp;h ouvrées.
      </p>

      <form id="contact-form" action="#" method="post" autocomplete="on" novalidate>
        <div class="field">
          <label for="contact-name">Nom</label>
          <input id="contact-name" name="name" type="text" required maxlength="200" autocomplete="name" />
        </div>
        <div class="field">
          <label for="contact-email">E-mail professionnel</label>
          <input id="contact-email" name="email" type="email" required maxlength="254" autocomplete="email" />
        </div>
        <div class="field">
          <label for="contact-company">Société <span class="opt">(optionnel)</span></label>
          <input id="contact-company" name="company" type="text" maxlength="200" autocomplete="organization" />
        </div>
        <div class="field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" required maxlength="8000" placeholder="Décrivez votre besoin…"></textarea>
        </div>

        <div class="hp" aria-hidden="true">
          <label for="contact-website">Ne pas remplir</label>
          <input type="text" id="contact-website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" class="btn-submit" id="contact-submit">
          <span id="contact-submit-label">Envoyer le message</span>
        </button>
      </form>

      <div class="msg err" id="contact-error" role="alert"></div>
      <div class="msg ok" id="contact-success" role="status"></div>

      <p class="footer-note">
        Vous préférez réserver un créneau&nbsp;?
        <a href="demo-booking.html">Demandez une démo</a>
      </p>
    </div>
  </main>

  <script>
    (function () {
      const form = document.getElementById("contact-form");
      const errEl = document.getElementById("contact-error");
      const okEl = document.getElementById("contact-success");
      const btn = document.getElementById("contact-submit");
      const label = document.getElementById("contact-submit-label");

      function showErr(msg) {
        okEl.classList.remove("show");
        errEl.textContent = msg;
        errEl.classList.add("show");
      }

      function showOk(msg) {
        errEl.classList.remove("show");
        okEl.textContent = msg;
        okEl.classList.add("show");
      }

      function hideMsgs() {
        errEl.classList.remove("show");
        okEl.classList.remove("show");
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        hideMsgs();

        const name = document.getElementById("contact-name").value.trim();
        const email = document.getElementById("contact-email").value.trim();
        const company = document.getElementById("contact-company").value.trim();
        const message = document.getElementById("contact-message").value.trim();
        const website = document.getElementById("contact-website").value;

        if (!name || !email || !message) {
          showErr("Merci de remplir le nom, l’e-mail et le message.");
          return;
        }

        btn.disabled = true;
        label.textContent = "Envoi en cours…";

        try {
          const res = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, company, message, website }),
          });
          const data = await res.json().catch(function () {
            return {};
          });

          if (!res.ok) {
            showErr(data.error || "Envoi impossible. Réessayez plus tard.");
            return;
          }

          showOk("Message envoyé. Nous vous répondons sous 24 h ouvrées.");
          form.reset();
        } catch (err) {
          showErr("Erreur réseau. Vérifiez votre connexion et réessayez.");
        } finally {
          btn.disabled = false;
          label.textContent = "Envoyer le message";
        }
      });
    })();
  </script>
</body>
</html>
