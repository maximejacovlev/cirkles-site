  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-heading: 'Clash Display', sans-serif;
      --font-body: 'Inter Tight', sans-serif;
    }

    html,
    body {
      background: #fff;
      color: #000;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px 48px;
      position: relative;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(55% 40% at 20% 10%, rgba(0, 0, 0, 0.03) 0%, transparent 60%),
        radial-gradient(50% 40% at 80% 90%, rgba(0, 0, 0, 0.025) 0%, transparent 60%);
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      padding: 36px 32px 40px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.035);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    @media (max-width: 520px) {
      .card {
        padding: 28px 22px 32px;
      }
    }

    h1 {
      font-family: var(--font-heading);
      font-size: clamp(26px, 4vw, 32px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .lede {
      font-size: 14px;
      line-height: 1.55;
      color: rgba(0, 0, 0, 0.5);
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
    }

    label .opt {
      font-weight: 500;
      text-transform: none;
      letter-spacing: 0;
      color: rgba(0, 0, 0, 0.28);
      font-size: 11px;
    }

    .field {
      margin-bottom: 18px;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      font-family: var(--font-body);
      font-size: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(0, 0, 0, 0.28);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }

    .hp {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .btn-submit {
      width: 100%;
      margin-top: 8px;
      padding: 13px 20px;
      border: none;
      border-radius: 999px;
      background: #000;
      color: #fff;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.85);
    }

    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
      display: none;
    }

    .msg.show {
      display: block;
    }

    .msg.err {
      background: rgba(220, 40, 40, 0.08);
      color: #991b1b;
    }

    .msg.ok {
      background: rgba(22, 101, 52, 0.08);
      color: #14532d;
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.35);
    }

    .footer-note a {
      color: rgba(0, 0, 0, 0.5);
    }
  </style>
  <link rel="stylesheet" href="css/i18n.css" />
  </head>
<body>
  <main class="page">
    <div class="card">
      <h1>Onboarding</h1>
      <p class="lede">
        Vous avez déjà assisté à une démo et êtes tenté par un essai&nbsp;? Remplissez ce formulaire pour un onboarding rapide.
      </p>

      <form id="onboarding-form" action="#" method="post" autocomplete="on" novalidate>
        <div class="field">
          <label for="onboarding-firstname">Prénom</label>
          <input id="onboarding-firstname" name="firstname" type="text" required maxlength="100" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="onboarding-lastname">Nom</label>
          <input id="onboarding-lastname" name="lastname" type="text" required maxlength="100" autocomplete="family-name" />
        </div>
        <div class="field">
          <label for="onboarding-email">E-mail professionnel</label>
          <input id="onboarding-email" name="email" type="email" required maxlength="254" autocomplete="email" />
        </div>
        <div class="field">
          <label for="onboarding-company">Société</label>
          <input id="onboarding-company" name="company" type="text" required maxlength="200" autocomplete="organization" />
        </div>

        <div class="hp" aria-hidden="true">
          <label for="onboarding-website">Ne pas remplir</label>
          <input type="text" id="onboarding-website" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" class="btn-submit" id="onboarding-submit">
          <span id="onboarding-submit-label">Lancer mon onboarding</span>
        </button>
      </form>

      <div class="msg err" id="onboarding-error" role="alert"></div>
      <div class="msg ok" id="onboarding-success" role="status"></div>

    </div>
  </main>

  <script>
    (function () {
      const form = document.getElementById("onboarding-form");
      const errEl = document.getElementById("onboarding-error");
      const okEl = document.getElementById("onboarding-success");
      const btn = document.getElementById("onboarding-submit");
      const label = document.getElementById("onboarding-submit-label");

      function showErr(msg) {
        okEl.classList.remove("show");
        errEl.textContent = msg;
        errEl.classList.add("show");
      }

      function showOk(msg) {
        errEl.classList.remove("show");
        okEl.textContent = msg;
        okEl.classList.add("show");
      }

      function hideMsgs() {
        errEl.classList.remove("show");
        okEl.classList.remove("show");
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        hideMsgs();

        const firstName = document.getElementById("onboarding-firstname").value.trim();
        const lastName = document.getElementById("onboarding-lastname").value.trim();
        const name = (firstName + " " + lastName).trim();
        const email = document.getElementById("onboarding-email").value.trim();
        const company = document.getElementById("onboarding-company").value.trim();
        const website = document.getElementById("onboarding-website").value;

        if (!firstName || !lastName || !email || !company) {
          showErr("Merci de remplir le prénom, le nom, l’e-mail et la société.");
          return;
        }

        btn.disabled = true;
        label.textContent = "Envoi en cours…";
        if (window.cirklesI18n) window.cirklesI18n.apply();

        try {
          const res = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              email,
              company,
              message: "[Onboarding]",
              website,
            }),
          });
          const data = await res.json().catch(function () {
            return {};
          });

          if (!res.ok) {
            showErr(data.error || "Envoi impossible. Réessayez plus tard.");
            return;
          }

          showOk("Demande envoyée. Nous vous recontactons sous 24 h ouvrées pour lancer votre onboarding.");
          form.reset();
        } catch (err) {
          showErr("Erreur réseau. Vérifiez votre connexion et réessayez.");
        } finally {
          btn.disabled = false;
          label.textContent = "Lancer mon onboarding";
          if (window.cirklesI18n) window.cirklesI18n.apply();
        }
      });
    })();
  </script>
  <script src="js/site-nav.js"></script>
  <script src="js/i18n-en.js"></script>
<script src="js/i18n.js"></script>
  </body>
</html>
